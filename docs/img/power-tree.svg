<svg viewBox="0 0 1060 380" xmlns="http://www.w3.org/2000/svg"
     font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',Arial,sans-serif">
  <defs>
    <marker id="pw" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8B8168"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="380" fill="#FFFDF7" rx="4"/>

  <!-- Title -->
  <text x="530" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#2E2A22">電源樹</text>
  <text x="530" y="50" text-anchor="middle" font-size="12" fill="#8B8168">實驗室電源最大 60 V・預設 40 V・限流只在 DAC 支路・限流動作時 MCU 與 ADC 不受影響</text>

  <!-- ========== Lab Supply ========== -->
  <rect x="30" y="110" width="180" height="90" rx="8" fill="#FFFDF7" stroke="#8B8168" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="120" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#5B5342">實驗室電源</text>
  <text x="120" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#2E2A22">最大 60 V（預設 40 V）</text>
  <text x="120" y="174" text-anchor="middle" font-size="10" fill="#8B8168">E0 後視 R_h 調整實際電壓</text>
  <text x="120" y="190" text-anchor="middle" font-size="10" fill="#8B8168">所有軌同時上下電</text>

  <!-- ========== Current Limiter ========== -->
  <rect x="290" y="80" width="130" height="50" rx="7" fill="#F8E9E3" stroke="#B5533C" stroke-width="1.4"/>
  <text x="355" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#B5533C">限流</text>
  <text x="355" y="120" text-anchor="middle" font-size="10" fill="#5B5342">只在 DAC 支路</text>

  <!-- ========== DAC VCC ========== -->
  <rect x="500" y="72" width="230" height="68" rx="7" fill="#F8E9E3" stroke="#B5533C" stroke-width="1.4"/>
  <text x="615" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#B5533C">DAC81416-08EVM VCC</text>
  <text x="615" y="114" text-anchor="middle" font-size="10.5" fill="#5B5342">加熱器與探針的唯一高壓源</text>
  <text x="615" y="130" text-anchor="middle" font-size="10" fill="#8B8168">耗散在 VCC/2 附近最大</text>

  <!-- ========== LM2596S ========== -->
  <rect x="290" y="160" width="130" height="80" rx="7" fill="#FFFDF7" stroke="#8B8168" stroke-width="1.4"/>
  <text x="355" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#5B5342">LM2596S</text>
  <text x="355" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#2E2A22">≤ 60 V → 5.3 V</text>
  <text x="355" y="218" text-anchor="middle" font-size="9.5" fill="#8B8168">輸入耐壓 ≥ 80 V 電容</text>
  <text x="355" y="232" text-anchor="middle" font-size="9.5" fill="#8B8168">輸出 +100 µF</text>

  <!-- ========== ADS9324EVM J19 ========== -->
  <rect x="500" y="160" width="230" height="80" rx="7" fill="#E4F1EE" stroke="#1F8A7D" stroke-width="1.4"/>
  <text x="615" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1F8A7D">ADS9324EVM J19</text>
  <text x="615" y="202" text-anchor="middle" font-size="10.5" fill="#5B5342">JP1 [2-3] EXT_PWR・LM66100・6 V TVS</text>
  <text x="615" y="218" text-anchor="middle" font-size="10.5" fill="#5B5342">約 100 mA</text>
  <text x="615" y="234" text-anchor="middle" font-size="10" fill="#8B8168">板上 LDO 分出三軌 →</text>

  <!-- ========== EVM Board LDOs ========== -->
  <rect x="810" y="100" width="220" height="180" rx="8" fill="#E4F1EE" stroke="#1F8A7D" stroke-width="1.4"/>
  <text x="920" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1F8A7D">EVM 板上 LDO</text>
  <rect x="826" y="136" width="188" height="24" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="920" y="153" text-anchor="middle" font-size="10.5" fill="#5B5342">U5 TPS7A2050 → AVDD 5 V</text>
  <rect x="826" y="166" width="188" height="24" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="920" y="183" text-anchor="middle" font-size="10.5" fill="#5B5342">U6 TPS7A2018 → AVDD 1.8 V</text>
  <rect x="826" y="196" width="188" height="24" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="920" y="213" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2E2A22">U4 TPS7A2033 → IOVDD 3.3 V</text>
  <rect x="826" y="226" width="188" height="24" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="920" y="243" text-anchor="middle" font-size="10.5" fill="#5B5342">U9 TPS7A2018 → 1V8_FMC</text>
  <text x="920" y="272" text-anchor="middle" font-size="9.5" fill="#8B8168">U4 需自行貼件（TPS7A2033PDBVR）</text>

  <!-- ========== GIGA USB ========== -->
  <rect x="290" y="280" width="130" height="42" rx="7" fill="#E7ECF6" stroke="#3A5BA8" stroke-width="1.4"/>
  <text x="355" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#3A5BA8">PC USB-C</text>

  <rect x="500" y="280" width="230" height="42" rx="7" fill="#E7ECF6" stroke="#3A5BA8" stroke-width="1.4"/>
  <text x="615" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#3A5BA8">GIGA R1 WiFi</text>
  <text x="615" y="314" text-anchor="middle" font-size="10.5" fill="#5B5342">約 0.5 A</text>

  <!-- ========== Connections ========== -->

  <!-- 36V → Current Limiter -->
  <path d="M210,150 L250,150 L250,105 L286,105" fill="none" stroke="#8B8168" stroke-width="2" marker-end="url(#pw)"/>
  <text x="218" y="142" font-size="10" fill="#8B8168">40 V（預設）</text>

  <!-- Current Limiter → DAC VCC -->
  <line x1="420" y1="105" x2="496" y2="105" stroke="#8B8168" stroke-width="2" marker-end="url(#pw)"/>

  <!-- 36V → LM2596S (from before limiter) -->
  <path d="M250,150 L250,200 L286,200" fill="none" stroke="#8B8168" stroke-width="2" marker-end="url(#pw)"/>

  <!-- LM2596S → ADC J19 -->
  <line x1="420" y1="200" x2="496" y2="200" stroke="#8B8168" stroke-width="2" marker-end="url(#pw)"/>
  <text x="445" y="193" font-size="10" font-weight="600" fill="#5B5342">5.3 V</text>

  <!-- ADC J19 → EVM LDOs -->
  <line x1="730" y1="200" x2="806" y2="200" stroke="#8B8168" stroke-width="2" marker-end="url(#pw)"/>

  <!-- USB → GIGA -->
  <line x1="420" y1="301" x2="496" y2="301" stroke="#8B8168" stroke-width="2" marker-end="url(#pw)"/>
  <text x="445" y="294" font-size="10" fill="#5B5342">5 V</text>

  <!-- Footer -->
  <text x="530" y="348" text-anchor="middle" font-size="10" fill="#8B8168">限流只放在 DAC VCC 支路，LM2596S 從限流之前取電：限流動作時只有加熱器掉電，MCU 與 ADC 不會跟著重置而丟資料</text>
  <text x="530" y="366" text-anchor="middle" font-size="10" fill="#8B8168">GIGA 由 USB 供電，不從高壓取電（VIN 排針需 ≥ 6 V，不用）</text>
</svg>
