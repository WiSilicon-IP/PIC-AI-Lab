<svg viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg"
     font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',Arial,sans-serif">
  <defs>
    <marker id="ao" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B8860B"/></marker>
    <marker id="ah" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B5533C"/></marker>
    <marker id="aa" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1F8A7D"/></marker>
    <marker id="ad" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3A5BA8"/></marker>
    <marker id="ap" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8B8168"/></marker>
  </defs>

  <rect width="1100" height="800" fill="#FFFDF7" rx="4"/>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#2E2A22">PIC 量測系統架構</text>
  <text x="550" y="52" text-anchor="middle" font-size="12" fill="#8B8168">GIGA R1 WiFi 控制、DAC81416-08EVM 驅動、ADS9324EVM 讀取、MEMS 探針 + 多級 MZI 晶片</text>

  <!-- Legend -->
  <line x1="200" y1="72" x2="228" y2="72" stroke="#B8860B" stroke-width="2.4" marker-end="url(#ao)"/>
  <text x="234" y="76" font-size="10.5" fill="#5B5342">光路</text>
  <line x1="280" y1="72" x2="308" y2="72" stroke="#B5533C" stroke-width="2.4" marker-end="url(#ah)"/>
  <text x="314" y="76" font-size="10.5" fill="#5B5342">驅動電壓</text>
  <line x1="390" y1="72" x2="418" y2="72" stroke="#1F8A7D" stroke-width="2.4" marker-end="url(#aa)"/>
  <text x="424" y="76" font-size="10.5" fill="#5B5342">類比量測</text>
  <line x1="500" y1="72" x2="528" y2="72" stroke="#3A5BA8" stroke-width="2.4" marker-end="url(#ad)"/>
  <text x="534" y="76" font-size="10.5" fill="#5B5342">數位控制</text>
  <line x1="610" y1="72" x2="638" y2="72" stroke="#8B8168" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ap)"/>
  <text x="644" y="76" font-size="10.5" fill="#5B5342">電源</text>

  <!-- ================================================================ -->
  <!--  ROW 1  (y 100–270):  Laser / DAC / Si Chip                     -->
  <!-- ================================================================ -->

  <!-- Tunable Laser -->
  <rect x="30" y="110" width="210" height="76" rx="8" fill="#FAF6EA" stroke="#C2AE7E" stroke-width="1.4"/>
  <text x="135" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#2E2A22">可調雷射</text>
  <text x="135" y="154" text-anchor="middle" font-size="11" fill="#5B5342">C-band・1550 nm</text>
  <text x="135" y="172" text-anchor="middle" font-size="10" fill="#8B8168">波長 / 功率：SCPI over LAN</text>

  <!-- DAC81416-08EVM -->
  <rect x="300" y="110" width="260" height="160" rx="8" fill="#F8E9E3" stroke="#B5533C" stroke-width="1.4"/>
  <text x="430" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#B5533C">DAC81416-08EVM</text>
  <text x="430" y="152" text-anchor="middle" font-size="11" fill="#5B5342">16 ch・20-bit・0–40 V</text>
  <rect x="318" y="164" width="224" height="28" rx="5" fill="#FFFDF7" stroke="#B5533C" stroke-width="0.9"/>
  <text x="430" y="183" text-anchor="middle" font-size="10.5" fill="#5B5342">CH0–7：heater 0–40 V（直接接晶片）</text>
  <rect x="318" y="198" width="224" height="28" rx="5" fill="#FFFDF7" stroke="#B5533C" stroke-width="0.9"/>
  <text x="430" y="217" text-anchor="middle" font-size="10.5" fill="#5B5342">CH8–11：probe 0–40 V（經被動分壓）</text>
  <text x="430" y="256" text-anchor="middle" font-size="9.5" fill="#8B8168">VCC 36 V・POR 歸零・過溫關斷・J18 開路</text>

  <!-- Si Photonic Chip (DUT) — tall block on the right -->
  <rect x="860" y="110" width="210" height="380" rx="10" fill="#FAF6EA" stroke="#C2AE7E" stroke-width="1.6"/>
  <text x="965" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#2E2A22">Si 光子晶片</text>
  <text x="965" y="154" text-anchor="middle" font-size="11" fill="#5B5342">SOI 220 nm・1550 nm</text>
  <rect x="880" y="170" width="170" height="56" rx="6" fill="#FFFDF7" stroke="#C2AE7E" stroke-width="1.1"/>
  <text x="965" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#2E2A22">多顆可調 MZI</text>
  <text x="965" y="208" text-anchor="middle" font-size="10.5" fill="#5B5342">加熱器 θ₁ / θ₂・約 40 V → 2π</text>
  <rect x="880" y="238" width="170" height="56" rx="6" fill="#FFFDF7" stroke="#C2AE7E" stroke-width="1.1"/>
  <text x="965" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#2E2A22">4 支 MEMS 探針</text>
  <text x="965" y="274" text-anchor="middle" font-size="10.5" fill="#5B5342">可變 tap・0–7 V・pull-in 風險</text>
  <rect x="880" y="306" width="170" height="46" rx="6" fill="#FFFDF7" stroke="#C2AE7E" stroke-width="1.1"/>
  <text x="965" y="324" text-anchor="middle" font-size="12" font-weight="600" fill="#2E2A22">探針光柵（向上出光）</text>
  <text x="965" y="340" text-anchor="middle" font-size="10.5" fill="#5B5342">一柵一 PD</text>
  <rect x="880" y="364" width="170" height="46" rx="6" fill="#FFFDF7" stroke="#C2AE7E" stroke-width="1.1"/>
  <text x="965" y="382" text-anchor="middle" font-size="12" font-weight="600" fill="#2E2A22">主輸出光纖埠</text>
  <text x="965" y="398" text-anchor="middle" font-size="10.5" fill="#5B5342">解耦參考</text>
  <rect x="880" y="422" width="170" height="30" rx="6" fill="#FFFDF7" stroke="#C2AE7E" stroke-width="1.1"/>
  <text x="965" y="442" text-anchor="middle" font-size="10.5" fill="#5B5342">heater 回流端・串 shunt</text>
  <text x="965" y="478" text-anchor="middle" font-size="9.5" fill="#8B8168">拓樸待確認</text>

  <!-- ================================================================ -->
  <!--  ROW 2  (y 310–480):  Host PC / GIGA R1 / Passive Board          -->
  <!-- ================================================================ -->

  <!-- Host PC -->
  <rect x="30" y="320" width="210" height="120" rx="8" fill="#E7ECF6" stroke="#3A5BA8" stroke-width="1.4"/>
  <text x="135" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#3A5BA8">Host PC</text>
  <rect x="48" y="358" width="174" height="24" rx="4" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.8"/>
  <text x="135" y="375" text-anchor="middle" font-size="10.5" fill="#5B5342">Python 掃描腳本・資料紀錄</text>
  <rect x="48" y="388" width="174" height="24" rx="4" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.8"/>
  <text x="135" y="405" text-anchor="middle" font-size="10.5" fill="#5B5342">擬合・SAX 模型・留出驗證</text>
  <text x="135" y="432" text-anchor="middle" font-size="9.5" fill="#8B8168">不在即時迴路內</text>

  <!-- Arduino GIGA R1 WiFi -->
  <rect x="300" y="320" width="260" height="170" rx="8" fill="#E7ECF6" stroke="#3A5BA8" stroke-width="1.6"/>
  <text x="430" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#3A5BA8">Arduino GIGA R1 WiFi</text>
  <text x="430" y="362" text-anchor="middle" font-size="11" fill="#5B5342">STM32H747XI</text>
  <rect x="318" y="374" width="110" height="32" rx="5" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.9"/>
  <text x="373" y="392" text-anchor="middle" font-size="11" font-weight="600" fill="#2E2A22">M7 480 MHz</text>
  <text x="373" y="406" text-anchor="middle" font-size="9" fill="#8B8168">ADC 收資料</text>
  <rect x="436" y="374" width="110" height="32" rx="5" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.9"/>
  <text x="491" y="392" text-anchor="middle" font-size="11" font-weight="600" fill="#2E2A22">M4 240 MHz</text>
  <text x="491" y="406" text-anchor="middle" font-size="9" fill="#8B8168">DAC 掃描</text>
  <rect x="318" y="418" width="224" height="26" rx="5" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.9"/>
  <text x="430" y="436" text-anchor="middle" font-size="10.5" fill="#5B5342">8 MB SDRAM（暫態波形暫存）</text>
  <rect x="318" y="450" width="224" height="26" rx="5" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.9"/>
  <text x="430" y="468" text-anchor="middle" font-size="10.5" fill="#5B5342">SPI-A → DAC　SPI-B → ADC</text>

  <!-- Passive Board — positioned between DAC/Chip and ADC/PD -->
  <rect x="630" y="310" width="180" height="140" rx="8" fill="#F8E9E3" stroke="#B5533C" stroke-width="1.4"/>
  <text x="720" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#B5533C">被動轉接板</text>
  <text x="720" y="354" text-anchor="middle" font-size="10.5" fill="#8B8168">無主動元件、無 MUX</text>
  <rect x="648" y="366" width="144" height="24" rx="4" fill="#FFFDF7" stroke="#B5533C" stroke-width="0.8"/>
  <text x="720" y="383" text-anchor="middle" font-size="10.5" fill="#5B5342">probe 分壓 → ≤ 7 V</text>
  <rect x="648" y="396" width="144" height="24" rx="4" fill="#FFFDF7" stroke="#B5533C" stroke-width="0.8"/>
  <text x="720" y="413" text-anchor="middle" font-size="10.5" fill="#5B5342">R_bot 抽頭 → ADC</text>
  <rect x="648" y="426" width="144" height="24" rx="4" fill="#FFFDF7" stroke="#B5533C" stroke-width="0.8"/>
  <text x="720" y="443" text-anchor="middle" font-size="10.5" fill="#5B5342">heater shunt → ADC</text>

  <!-- ================================================================ -->
  <!--  ROW 3  (y 540–710):  Power / ADC / PD                           -->
  <!-- ================================================================ -->

  <!-- Power Supply -->
  <rect x="30" y="560" width="210" height="100" rx="8" fill="#FFFDF7" stroke="#8B8168" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="135" y="586" text-anchor="middle" font-size="14" font-weight="700" fill="#5B5342">電源</text>
  <text x="135" y="606" text-anchor="middle" font-size="11" fill="#5B5342">實驗室電源 36 V（限流）</text>
  <text x="135" y="624" text-anchor="middle" font-size="11" fill="#5B5342">LM2596S → 5.3 V → ADC J19</text>
  <text x="135" y="642" text-anchor="middle" font-size="11" fill="#5B5342">GIGA：PC USB-C 供電</text>

  <!-- ADS9324EVM -->
  <rect x="300" y="540" width="260" height="170" rx="8" fill="#E4F1EE" stroke="#1F8A7D" stroke-width="1.4"/>
  <text x="430" y="564" text-anchor="middle" font-size="14" font-weight="700" fill="#1F8A7D">ADS9324EVM（改板）</text>
  <text x="430" y="582" text-anchor="middle" font-size="11" fill="#5B5342">16 ch 同步・16-bit SAR・1 MSPS/ch</text>
  <rect x="318" y="594" width="224" height="24" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="430" y="611" text-anchor="middle" font-size="10.5" fill="#5B5342">±2.5 V・1 MΩ・內建 4.096 V 參考</text>
  <rect x="318" y="624" width="224" height="24" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="430" y="641" text-anchor="middle" font-size="10.5" fill="#5B5342">1-lane SPI・J20/J21・IOVDD 3.3 V</text>
  <rect x="318" y="654" width="224" height="24" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="430" y="671" text-anchor="middle" font-size="10.5" fill="#5B5342">片上 oversampling・25 / 325 kHz BW</text>
  <text x="430" y="700" text-anchor="middle" font-size="9.5" fill="#8B8168">J19 ← 5.3 V・板上 LDO 出 5 / 1.8 / 3.3 V</text>

  <!-- PD Modules — taller to fit content -->
  <rect x="630" y="540" width="180" height="170" rx="8" fill="#E4F1EE" stroke="#1F8A7D" stroke-width="1.4"/>
  <text x="720" y="564" text-anchor="middle" font-size="13" font-weight="700" fill="#1F8A7D">PD 模組</text>
  <text x="720" y="584" text-anchor="middle" font-size="11" fill="#5B5342">InGaAs・帶放大</text>
  <text x="720" y="600" text-anchor="middle" font-size="11" fill="#5B5342">（PDA10CS2）</text>
  <rect x="648" y="614" width="144" height="24" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="720" y="631" text-anchor="middle" font-size="10.5" fill="#5B5342">探針光柵 PD ×4</text>
  <rect x="648" y="644" width="144" height="24" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="720" y="661" text-anchor="middle" font-size="10.5" fill="#5B5342">主輸出 PD ×N</text>
  <rect x="648" y="674" width="144" height="24" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="720" y="691" text-anchor="middle" font-size="10.5" fill="#5B5342">輸入參考 PD ×1</text>

  <!-- ================================================================ -->
  <!--  CONNECTIONS                                                      -->
  <!-- ================================================================ -->

  <!-- ── Optical ── -->

  <!-- Laser → Si Chip: fiber routed above DAC block -->
  <path d="M240,148 L270,148 L270,96 L835,96 L835,140 L856,140" fill="none" stroke="#B8860B" stroke-width="2.2" marker-end="url(#ao)"/>
  <text x="550" y="90" text-anchor="middle" font-size="10" fill="#B8860B">光纖輸入（晶片外分光：輸入參考 → PD）</text>

  <!-- Si Chip → PD: grating/fiber output, route down then left into PD top -->
  <path d="M965,490 L965,520 L720,520 L720,536" fill="none" stroke="#B8860B" stroke-width="2.2" marker-end="url(#ao)"/>
  <text x="860" y="515" font-size="10" fill="#B8860B">光柵 / 光纖出光</text>

  <!-- ── HV Drive (red) ── -->

  <!-- DAC → Chip: heater direct, route above passive board -->
  <path d="M560,178 L856,178" fill="none" stroke="#B5533C" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="710" y="172" font-size="10" fill="#B5533C">heater 0–40 V（直接接晶片）</text>

  <!-- DAC → Passive Board: probe voltage -->
  <path d="M560,212 L590,212 L590,380 L626,380" fill="none" stroke="#B5533C" stroke-width="2" marker-end="url(#ah)"/>
  <text x="600" y="296" font-size="10" fill="#B5533C" transform="rotate(90,600,296)">probe 0–40 V</text>

  <!-- Passive Board → Chip: limited probe voltage -->
  <path d="M810,350 L856,350" fill="none" stroke="#B5533C" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="833" y="342" text-anchor="middle" font-size="9.5" fill="#B5533C">≤ 7 V</text>

  <!-- ── Analog (teal) ── -->

  <!-- Passive Board → ADC: shunt & probe tap, route down through gap -->
  <path d="M720,450 L720,520 L560,520 L560,540" fill="none" stroke="#1F8A7D" stroke-width="2" marker-end="url(#aa)"/>
  <text x="654" y="516" font-size="10" fill="#1F8A7D">shunt・探針抽頭</text>

  <!-- PD → ADC: PD voltage -->
  <path d="M630,640 L564,640" fill="none" stroke="#1F8A7D" stroke-width="2" marker-end="url(#aa)"/>
  <text x="590" y="633" font-size="10" fill="#1F8A7D">PD 電壓</text>

  <!-- ── Digital (blue) ── -->

  <!-- Host PC ↔ GIGA: USB CDC -->
  <line x1="240" y1="380" x2="296" y2="380" stroke="#3A5BA8" stroke-width="2" marker-end="url(#ad)"/>
  <text x="255" y="372" font-size="10" fill="#3A5BA8">USB CDC</text>

  <!-- Host PC → Laser: LAN/SCPI -->
  <line x1="135" y1="320" x2="135" y2="190" stroke="#3A5BA8" stroke-width="2" marker-end="url(#ad)"/>
  <text x="143" y="260" font-size="10" fill="#3A5BA8">LAN / SCPI</text>

  <!-- GIGA → DAC: SPI-A (vertical, through gap) -->
  <line x1="430" y1="320" x2="430" y2="274" stroke="#3A5BA8" stroke-width="2" marker-end="url(#ad)"/>
  <text x="438" y="300" font-size="10" fill="#3A5BA8">SPI-A・nLDAC・nRESET</text>

  <!-- GIGA → ADC: SPI-B (vertical, through gap) -->
  <line x1="430" y1="490" x2="430" y2="536" stroke="#3A5BA8" stroke-width="2" marker-end="url(#ad)"/>
  <text x="438" y="518" font-size="10" fill="#3A5BA8">SPI-B・CONVST・BAS</text>

  <!-- ── Power (gray dashed) ── -->

  <!-- Power → DAC VCC: route right then up through gap between col 1 & 2 -->
  <path d="M240,590 L272,590 L272,190 L296,190" fill="none" stroke="#8B8168" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ap)"/>
  <text x="262" y="400" font-size="9.5" fill="#8B8168">36 V</text>

  <!-- Power → ADC: 5.3 V, short horizontal -->
  <path d="M240,625 L296,625" fill="none" stroke="#8B8168" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ap)"/>
  <text x="255" y="618" font-size="9.5" fill="#8B8168">5.3 V</text>

  <!-- ── Footer ── -->
  <text x="550" y="750" text-anchor="middle" font-size="10" fill="#8B8168">探針上限由 VCC × 分壓比在硬體上決定；MCU 重置或斷電時 DAC 輸出歸零（nRESET 外部下拉）</text>
  <text x="550" y="768" text-anchor="middle" font-size="10" fill="#8B8168">v3・GIGA R1 WiFi + ADS9324EVM（改板）+ DAC81416-08EVM・2026-10-08</text>
</svg>
