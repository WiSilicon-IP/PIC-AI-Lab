<svg viewBox="0 0 1060 740" xmlns="http://www.w3.org/2000/svg"
     font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',Arial,sans-serif">
  <defs>
    <marker id="ao" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B8860B"/></marker>
    <marker id="ah" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B5533C"/></marker>
    <marker id="aa" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1F8A7D"/></marker>
    <marker id="ad" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3A5BA8"/></marker>
    <marker id="ap" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8B8168"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="740" fill="#FFFDF7" rx="4"/>

  <!-- Title -->
  <text x="530" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#2E2A22">PIC 量測系統架構</text>
  <text x="530" y="54" text-anchor="middle" font-size="12" fill="#8B8168">GIGA R1 WiFi 控制、DAC81416-08EVM 驅動、ADS9324EVM 讀取、MEMS 探針 + 多級 MZI 晶片</text>

  <!-- Legend -->
  <line x1="160" y1="74" x2="188" y2="74" stroke="#B8860B" stroke-width="2.4" marker-end="url(#ao)"/>
  <text x="194" y="78" font-size="10.5" fill="#5B5342">光路</text>
  <line x1="240" y1="74" x2="268" y2="74" stroke="#B5533C" stroke-width="2.4" marker-end="url(#ah)"/>
  <text x="274" y="78" font-size="10.5" fill="#5B5342">驅動電壓</text>
  <line x1="340" y1="74" x2="368" y2="74" stroke="#1F8A7D" stroke-width="2.4" marker-end="url(#aa)"/>
  <text x="374" y="78" font-size="10.5" fill="#5B5342">類比量測</text>
  <line x1="440" y1="74" x2="468" y2="74" stroke="#3A5BA8" stroke-width="2.4" marker-end="url(#ad)"/>
  <text x="474" y="78" font-size="10.5" fill="#5B5342">數位控制</text>
  <line x1="550" y1="74" x2="578" y2="74" stroke="#8B8168" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ap)"/>
  <text x="584" y="78" font-size="10.5" fill="#5B5342">電源</text>

  <!-- ========== Si Photonic Chip (DUT) - right side, tall ========== -->
  <rect x="830" y="96" width="200" height="340" rx="10" fill="#FAF6EA" stroke="#C2AE7E" stroke-width="1.6"/>
  <text x="930" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#2E2A22">Si 光子晶片</text>
  <text x="930" y="138" text-anchor="middle" font-size="11" fill="#5B5342">SOI 220 nm・1550 nm</text>
  <rect x="852" y="152" width="156" height="56" rx="6" fill="#FFFDF7" stroke="#C2AE7E" stroke-width="1.1"/>
  <text x="930" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#2E2A22">多顆可調 MZI</text>
  <text x="930" y="188" text-anchor="middle" font-size="10.5" fill="#5B5342">加熱器 θ₁ / θ₂・約 40 V → 2π</text>
  <rect x="852" y="218" width="156" height="56" rx="6" fill="#FFFDF7" stroke="#C2AE7E" stroke-width="1.1"/>
  <text x="930" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#2E2A22">4 支 MEMS 探針</text>
  <text x="930" y="254" text-anchor="middle" font-size="10.5" fill="#5B5342">可變 tap・0–7 V・pull-in 風險</text>
  <rect x="852" y="284" width="156" height="46" rx="6" fill="#FFFDF7" stroke="#C2AE7E" stroke-width="1.1"/>
  <text x="930" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#2E2A22">探針光柵</text>
  <text x="930" y="318" text-anchor="middle" font-size="10.5" fill="#5B5342">向上出光・一柵一 PD</text>
  <rect x="852" y="340" width="156" height="46" rx="6" fill="#FFFDF7" stroke="#C2AE7E" stroke-width="1.1"/>
  <text x="930" y="358" text-anchor="middle" font-size="12" font-weight="600" fill="#2E2A22">主輸出光纖埠</text>
  <text x="930" y="374" text-anchor="middle" font-size="10.5" fill="#5B5342">解耦參考</text>
  <rect x="852" y="396" width="156" height="30" rx="6" fill="#FFFDF7" stroke="#C2AE7E" stroke-width="1.1"/>
  <text x="930" y="416" text-anchor="middle" font-size="10.5" fill="#5B5342">heater 回流端・串 shunt</text>

  <!-- ========== Tunable Laser ========== -->
  <rect x="30" y="96" width="200" height="74" rx="8" fill="#FAF6EA" stroke="#C2AE7E" stroke-width="1.4"/>
  <text x="130" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#2E2A22">可調雷射</text>
  <text x="130" y="138" text-anchor="middle" font-size="11" fill="#5B5342">C-band・波長與功率</text>
  <text x="130" y="154" text-anchor="middle" font-size="10.5" fill="#8B8168">SCPI over LAN</text>

  <!-- ========== DAC81416-08EVM ========== -->
  <rect x="300" y="96" width="240" height="150" rx="8" fill="#F8E9E3" stroke="#B5533C" stroke-width="1.4"/>
  <text x="420" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#B5533C">DAC81416-08EVM</text>
  <text x="420" y="138" text-anchor="middle" font-size="11" fill="#5B5342">16 ch・20-bit・0–40 V</text>
  <rect x="316" y="148" width="208" height="30" rx="5" fill="#FFFDF7" stroke="#B5533C" stroke-width="0.9"/>
  <text x="420" y="168" text-anchor="middle" font-size="10.5" fill="#5B5342">CH0–7：heater（直接接晶片）</text>
  <rect x="316" y="184" width="208" height="30" rx="5" fill="#FFFDF7" stroke="#B5533C" stroke-width="0.9"/>
  <text x="420" y="204" text-anchor="middle" font-size="10.5" fill="#5B5342">CH8–11：probe（經被動分壓）</text>
  <text x="420" y="234" text-anchor="middle" font-size="9.5" fill="#8B8168">VCC 36 V・POR 歸零・過溫關斷・J18 開路</text>

  <!-- ========== Passive Board ========== -->
  <rect x="620" y="190" width="160" height="110" rx="8" fill="#F8E9E3" stroke="#B5533C" stroke-width="1.4"/>
  <text x="700" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#B5533C">被動轉接板</text>
  <rect x="634" y="224" width="132" height="22" rx="4" fill="#FFFDF7" stroke="#B5533C" stroke-width="0.8"/>
  <text x="700" y="240" text-anchor="middle" font-size="10" fill="#5B5342">probe 分壓 → ≤ 7 V</text>
  <rect x="634" y="250" width="132" height="22" rx="4" fill="#FFFDF7" stroke="#B5533C" stroke-width="0.8"/>
  <text x="700" y="266" text-anchor="middle" font-size="10" fill="#5B5342">R_bot 抽頭 → ADC</text>
  <rect x="634" y="276" width="132" height="22" rx="4" fill="#FFFDF7" stroke="#B5533C" stroke-width="0.8"/>
  <text x="700" y="292" text-anchor="middle" font-size="10" fill="#5B5342">heater shunt → ADC</text>

  <!-- ========== Host PC ========== -->
  <rect x="30" y="280" width="200" height="110" rx="8" fill="#E7ECF6" stroke="#3A5BA8" stroke-width="1.4"/>
  <text x="130" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#3A5BA8">Host PC</text>
  <rect x="46" y="314" width="168" height="22" rx="4" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.8"/>
  <text x="130" y="330" text-anchor="middle" font-size="10.5" fill="#5B5342">Python 掃描腳本・資料紀錄</text>
  <rect x="46" y="340" width="168" height="22" rx="4" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.8"/>
  <text x="130" y="356" text-anchor="middle" font-size="10.5" fill="#5B5342">擬合・SAX 模型・留出驗證</text>
  <text x="130" y="380" text-anchor="middle" font-size="9.5" fill="#8B8168">不在即時迴路內</text>

  <!-- ========== GIGA R1 WiFi ========== -->
  <rect x="300" y="280" width="240" height="160" rx="8" fill="#E7ECF6" stroke="#3A5BA8" stroke-width="1.6"/>
  <text x="420" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#3A5BA8">Arduino GIGA R1 WiFi</text>
  <text x="420" y="322" text-anchor="middle" font-size="11" fill="#5B5342">STM32H747XI</text>
  <rect x="316" y="332" width="100" height="28" rx="5" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.9"/>
  <text x="366" y="348" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2E2A22">M7 480 MHz</text>
  <text x="366" y="362" text-anchor="middle" font-size="9" fill="#8B8168">ADC 收資料</text>
  <rect x="424" y="332" width="100" height="28" rx="5" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.9"/>
  <text x="474" y="348" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2E2A22">M4 240 MHz</text>
  <text x="474" y="362" text-anchor="middle" font-size="9" fill="#8B8168">DAC 掃描</text>
  <rect x="316" y="374" width="208" height="24" rx="5" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.9"/>
  <text x="420" y="391" text-anchor="middle" font-size="10.5" fill="#5B5342">8 MB SDRAM（暫態波形暫存）</text>
  <rect x="316" y="404" width="208" height="24" rx="5" fill="#FFFDF7" stroke="#3A5BA8" stroke-width="0.9"/>
  <text x="420" y="421" text-anchor="middle" font-size="10.5" fill="#5B5342">SPI-A → DAC　SPI-B → ADC</text>

  <!-- ========== ADS9324EVM ========== -->
  <rect x="300" y="510" width="240" height="150" rx="8" fill="#E4F1EE" stroke="#1F8A7D" stroke-width="1.4"/>
  <text x="420" y="534" text-anchor="middle" font-size="14" font-weight="700" fill="#1F8A7D">ADS9324EVM（改板）</text>
  <text x="420" y="552" text-anchor="middle" font-size="11" fill="#5B5342">16 ch 同步・16-bit SAR・1 MSPS/ch</text>
  <rect x="316" y="562" width="208" height="22" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="420" y="578" text-anchor="middle" font-size="10.5" fill="#5B5342">±2.5 V・1 MΩ・內建 4.096 V 參考</text>
  <rect x="316" y="588" width="208" height="22" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="420" y="604" text-anchor="middle" font-size="10.5" fill="#5B5342">1-lane SPI・J20/J21・IOVDD 3.3 V</text>
  <rect x="316" y="614" width="208" height="22" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="420" y="630" text-anchor="middle" font-size="10.5" fill="#5B5342">片上 oversampling・25 / 325 kHz BW</text>
  <text x="420" y="652" text-anchor="middle" font-size="9.5" fill="#8B8168">J19 ← 5.3 V・板上 LDO 出 5 / 1.8 / 3.3 V</text>

  <!-- ========== PD Modules ========== -->
  <rect x="620" y="510" width="160" height="120" rx="8" fill="#E4F1EE" stroke="#1F8A7D" stroke-width="1.4"/>
  <text x="700" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#1F8A7D">PD 模組</text>
  <text x="700" y="552" text-anchor="middle" font-size="11" fill="#5B5342">InGaAs・帶放大</text>
  <rect x="634" y="562" width="132" height="22" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="700" y="578" text-anchor="middle" font-size="10" fill="#5B5342">探針光柵 PD ×4</text>
  <rect x="634" y="588" width="132" height="22" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="700" y="604" text-anchor="middle" font-size="10" fill="#5B5342">主輸出 PD ×N</text>
  <rect x="634" y="614" width="132" height="22" rx="4" fill="#FFFDF7" stroke="#1F8A7D" stroke-width="0.8"/>
  <text x="700" y="630" text-anchor="middle" font-size="10" fill="#5B5342">輸入參考 PD ×1</text>

  <!-- ========== Power Supply ========== -->
  <rect x="30" y="510" width="200" height="100" rx="8" fill="#FFFDF7" stroke="#8B8168" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="130" y="534" text-anchor="middle" font-size="14" font-weight="700" fill="#5B5342">電源</text>
  <text x="130" y="554" text-anchor="middle" font-size="11" fill="#5B5342">實驗室電源 36 V（限流）</text>
  <text x="130" y="572" text-anchor="middle" font-size="11" fill="#5B5342">LM2596S → 5.3 V → ADC J19</text>
  <text x="130" y="590" text-anchor="middle" font-size="11" fill="#5B5342">GIGA：PC USB-C 供電</text>

  <!-- ========== Connections ========== -->

  <!-- Optical: Laser → Si Chip (top, across full width) -->
  <path d="M230,125 L820,125" fill="none" stroke="#B8860B" stroke-width="2.2" marker-end="url(#ao)"/>
  <text x="530" y="118" text-anchor="middle" font-size="10" fill="#B8860B">光纖輸入（晶片外分光：輸入參考 → PD）</text>

  <!-- Optical: Si Chip → PD (right side, down) -->
  <path d="M930,436 L930,480 L780,480 L780,510" fill="none" stroke="#B8860B" stroke-width="2.2" marker-end="url(#ao)"/>
  <text x="870" y="474" font-size="10" fill="#B8860B">光柵 / 光纖出光</text>

  <!-- Digital: Host PC ↔ GIGA (USB CDC) -->
  <line x1="230" y1="335" x2="296" y2="335" stroke="#3A5BA8" stroke-width="2" marker-end="url(#ad)"/>
  <text x="250" y="328" font-size="10" fill="#3A5BA8">USB CDC</text>

  <!-- Digital: Host PC → Laser (LAN/SCPI) -->
  <line x1="130" y1="280" x2="130" y2="174" stroke="#3A5BA8" stroke-width="2" marker-end="url(#ad)"/>
  <text x="138" y="230" font-size="10" fill="#3A5BA8">LAN / SCPI</text>

  <!-- Digital: GIGA → DAC (SPI-A) -->
  <line x1="420" y1="280" x2="420" y2="250" stroke="#3A5BA8" stroke-width="2" marker-end="url(#ad)"/>
  <text x="428" y="268" font-size="10" fill="#3A5BA8">SPI-A・nLDAC・nRESET</text>

  <!-- Digital: GIGA → ADC (SPI-B) -->
  <line x1="420" y1="440" x2="420" y2="506" stroke="#3A5BA8" stroke-width="2" marker-end="url(#ad)"/>
  <text x="428" y="480" font-size="10" fill="#3A5BA8">SPI-B・CONVST・BAS</text>

  <!-- HV: DAC → Si Chip (heater, direct) -->
  <path d="M540,140 L826,140" fill="none" stroke="#B5533C" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="680" y="134" font-size="10" fill="#B5533C">heater 0–40 V（直接）</text>

  <!-- HV: DAC → Passive Board (probe) -->
  <path d="M540,200 L616,200" fill="none" stroke="#B5533C" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="560" y="193" font-size="10" fill="#B5533C">probe 0–40 V</text>

  <!-- HV: Passive Board → Si Chip (probe, limited) -->
  <path d="M780,240 L826,240" fill="none" stroke="#B5533C" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="795" y="233" font-size="9.5" fill="#B5533C">≤ 7 V</text>

  <!-- Analog: Passive Board → ADC (shunt / probe tap) -->
  <path d="M700,300 L700,380 L540,380 L540,506" fill="none" stroke="#1F8A7D" stroke-width="2.2" marker-end="url(#aa)"/>
  <text x="630" y="395" font-size="10" fill="#1F8A7D">shunt・探針抽頭</text>

  <!-- Analog: PD → ADC -->
  <line x1="620" y1="570" x2="544" y2="570" stroke="#1F8A7D" stroke-width="2.2" marker-end="url(#aa)"/>
  <text x="570" y="563" font-size="10" fill="#1F8A7D">PD 電壓</text>

  <!-- Power: Supply → DAC VCC -->
  <path d="M230,540 L265,540 L265,180 L296,180" fill="none" stroke="#8B8168" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ap)"/>
  <text x="268" y="460" font-size="9.5" fill="#8B8168">36 V</text>

  <!-- Power: Supply → ADC (5.3 V via LM2596S) -->
  <path d="M230,575 L275,575 L275,600 L296,600" fill="none" stroke="#8B8168" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ap)"/>
  <text x="256" y="600" font-size="9.5" fill="#8B8168">5.3 V</text>

  <!-- Footer note -->
  <text x="530" y="700" text-anchor="middle" font-size="10" fill="#8B8168">探針上限由 VCC × 分壓比在硬體上決定；MCU 重置或斷電時 DAC 輸出歸零（nRESET 外部下拉）</text>
  <text x="530" y="718" text-anchor="middle" font-size="10" fill="#8B8168">v3・GIGA R1 WiFi + ADS9324EVM（改板）+ DAC81416-08EVM・2026-10-08</text>
</svg>
